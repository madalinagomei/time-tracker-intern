
name: Daily Supabase Backup

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
            - name: Install PostgreSQL 17 client
        run: |
          docker pull postgres:17

            - name: Create database backup
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_BACKUP_URL }}
        run: |
          test -n "$DATABASE_URL"
          docker run --rm \
            -e DATABASE_URL \
            -v "$PWD:/backup" \
            postgres:17 \
            pg_dump \
              --dbname="$DATABASE_URL" \
              --format=custom \
              --no-owner \
              --no-acl \
              --file=/backup/timeline-backup.dump

      - name: Upload backup
        uses: actions/upload-artifact@v4
        with:
          name: timeline-backup-${{ github.run_id }}
          path: timeline-backup.dump
          retention-days: 30
          if-no-files-found: error
